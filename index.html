<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11150f">
<title>THE REAL ROVERS</title>
<style>
:root{
  --bg:#11150f; --bg2:#181e15; --zettel:#1e261a; --linie:#33402c;
  --text:#e9eddf; --leise:#9aa78f; --gruen:#7cb85a; --gruen-d:#4d7a36;
  --ocker:#d9a441; --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:14px 14px;
  color:var(--text);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  line-height:1.4;
  min-height:100vh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 40px}
.mono{font-family:"Courier New",ui-monospace,Menlo,monospace}

header{text-align:center;padding:10px 0 22px}
h1{
  font-family:"Rockwell","Courier New",ui-monospace,monospace;
  font-weight:800;
  font-size:clamp(1.7rem,8.2vw,2.6rem);
  letter-spacing:.06em;
  text-transform:uppercase;
}
h1 span{color:var(--gruen)}
.schnur{
  height:10px;margin:12px auto 0;max-width:280px;
  background:
    radial-gradient(circle at 5px 5px,var(--gruen-d) 3px,transparent 3.5px) 0 0/20px 10px repeat-x;
  opacity:.9;
}

ul{list-style:none;display:flex;flex-direction:column;gap:18px}
.zettel{
  position:relative;width:100%;text-align:left;cursor:pointer;
  background:var(--zettel);color:inherit;font:inherit;
  border:1px solid var(--linie);border-radius:var(--r);
  padding:16px 16px 14px 16px;
  display:flex;gap:14px;align-items:center;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
  transition:transform .15s ease, border-color .15s ease;
  -webkit-tap-highlight-color:transparent;
}
li:nth-child(odd) .zettel{transform:rotate(-.6deg)}
li:nth-child(even) .zettel{transform:rotate(.5deg)}
.zettel:hover,.zettel:focus-visible{transform:rotate(0) translateY(-2px);border-color:var(--gruen);outline:none}
.zettel::before{ /* Reissnagel */
  content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;
  border-radius:50%;background:var(--ocker);border:2px solid #0d100b;
  box-shadow:0 2px 0 rgba(0,0,0,.4);
}
.emoji{font-size:2rem;flex:none;width:2.4rem;text-align:center}
.info{flex:1;min-width:0}
.titel{font-weight:700;font-size:1.08rem}
.meta{font-size:.88rem;color:var(--leise);margin-top:2px}
.datum{
  flex:none;text-align:center;min-width:58px;
  border:1.5px dashed var(--gruen-d);border-radius:var(--r);
  padding:6px 6px 5px;color:var(--gruen);
}
.datum b{display:block;font-size:1.45rem;line-height:1}
.datum small{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.datum.offen{color:var(--ocker);border-color:var(--ocker);font-size:.8rem;padding:10px 6px}

.vorbei .zettel{opacity:.45}

/* nächster Termin */
.next .zettel{
  flex-direction:column;align-items:stretch;gap:12px;
  border:2px solid var(--gruen);padding:22px 16px 16px;
  background:#1b2a17;
}
.next .kopf{display:flex;gap:14px;align-items:center}
.stempel{
  position:absolute;top:-11px;right:12px;
  background:var(--gruen);color:#0d140a;
  font:700 .7rem "Courier New",monospace;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;transform:rotate(2deg);
}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.countdown div{
  background:var(--bg);border:1px solid var(--linie);border-radius:var(--r);
  padding:8px 0 6px;text-align:center;
}
.countdown b{display:block;font:700 1.55rem "Courier New",monospace;color:var(--gruen);font-variant-numeric:tabular-nums}
.countdown small{font-size:.65rem;color:var(--leise);text-transform:uppercase;letter-spacing:.1em}
.spruch{font-size:.85rem;color:var(--leise);text-align:center}

.zwischen{
  margin:30px 0 10px;text-align:center;color:var(--leise);
  font:.78rem "Courier New",monospace;letter-spacing:.18em;text-transform:uppercase;
}

.rover{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.rover span{
  font:600 .85rem "Courier New",monospace;
  border:1px solid var(--linie);border-radius:999px;padding:5px 12px;background:var(--bg2);
}
.rover span:nth-child(3n+1){border-color:var(--gruen-d)}
footer{text-align:center;color:var(--leise);font-size:.75rem;margin-top:34px}

/* Detailfenster */
dialog{
  margin:auto;width:min(92vw,420px);
  background:var(--zettel);color:var(--text);
  border:2px solid var(--gruen);border-radius:var(--r);padding:22px 20px 18px;
}
dialog::backdrop{background:rgba(5,8,4,.75)}
dialog h2{font-size:1.3rem;margin:6px 0 12px}
dialog .grosz{font-size:2.4rem}
dialog dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.95rem}
dialog dt{color:var(--leise)}
dialog p{margin-top:14px;font-size:.95rem}
dialog button{
  margin-top:18px;width:100%;padding:12px;font:700 1rem inherit;cursor:pointer;
  background:var(--gruen);color:#0d140a;border:0;border-radius:var(--r);
}
@media (prefers-reduced-motion:reduce){.zettel{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Real <span>Rovers</span></h1>
    <div class="schnur" aria-hidden="true"></div>
  </header>

  <main>
    <ul id="liste" aria-label="Termine"></ul>

    <div class="zwischen">— die sieben Rover —</div>
    <div class="rover" id="rover"></div>
  </main>

  <footer>Aagschlage uf em Brett · Änderige vorbehalte</footer>
</div>

<dialog id="detail" aria-labelledby="dTitel">
  <div class="grosz" id="dEmoji"></div>
  <h2 id="dTitel"></h2>
  <dl id="dInfo"></dl>
  <p id="dText"></p>
  <button type="button" id="zu">Passt, zuemache</button>
</dialog>

<script>
/* ============ HIER TERMINE ÄNDERN / ERGÄNZEN ============
   datum:  "JJJJ-MM-TT" oder null (Datum no offe)
   bis:    optional, Enddatum "JJJJ-MM-TT"
   zeit:   optional, Startzeit "HH:MM" (für Countdown), zeitText: Anzeige
   ort:    optional
   text:   optional, kurzer Spruch im Detailfenster
   Reihenfolge im Array egal – wird automatisch sortiert. */
const TERMINE = [
  { emoji:"🎂", titel:"Geburtstagsfestli Bombi", datum:"2026-11-14",
    text:"Bombi wird ein Jahr weiser. Kuchen ist Pflicht." },
  { emoji:"🎄", titel:"Wiehnachtsmärt", datum:null,
    text:"Datum no offe. Glühwii chunnt sicher, de Rest klärt sich." },
  { emoji:"🎆", titel:"Silvester", datum:"2026-12-31",
    text:"Es neus Jahr, die glichi Bande." },
  { emoji:"🔥", titel:"Grille im Wald", datum:"2027-01-23", zeit:"17:00",
    zeitText:"17:00 – offen", ort:"Froloo",
    text:"Wurscht, Cervelat und Stockbrot. Warm azieh!" },
  { emoji:"🥾", titel:"Wandere", datum:"2027-04-23", bis:"2027-04-25",
    text:"Drei Tage, zwei Beine, null Ausreden." }
];
const ROVER = ["Gazosa","Titöf","Bombadil","Peach","Joy","Capone","Zark"];
/* ======================================================== */

const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const WT = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const $ = id => document.getElementById(id);

function parse(d,z){
  if(!d) return null;
  const [y,m,t]=d.split("-").map(Number);
  const [h,mi]=(z||"00:00").split(":").map(Number);
  return new Date(y,m-1,t,h,mi);
}
const fmt = d => `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`;
function datumText(e){
  const s=parse(e.datum); if(!s) return "Datum no offe";
  if(e.bis){ const b=parse(e.bis);
    return `${s.getDate()}.–${b.getDate()}.${b.getMonth()+1}.${b.getFullYear()}`; }
  return `${WT[s.getDay()]}, ${fmt(s)}`;
}
function ende(e){ const b=parse(e.bis||e.datum); if(b) b.setHours(23,59,59); return b; }

const items = TERMINE.map(e=>({...e,start:parse(e.datum,e.zeit)}))
  .sort((a,b)=> a.start&&b.start ? a.start-b.start : a.start?-1 : b.start?1 : 0);

function badge(e){
  if(!e.start) return `<div class="datum offen mono">Datum<br>no offe</div>`;
  return `<div class="datum mono"><b>${e.start.getDate()}</b><small>${MON[e.start.getMonth()]}</small></div>`;
}
function metaText(e){
  return [e.bis?datumText(e):(e.start?null:"Datum no offe"), e.zeitText||e.zeit, e.ort]
    .filter(Boolean).join(" · ") || datumText(e);
}

let naechster=null;
function render(){
  const jetzt=new Date();
  naechster = items.find(e=>e.start && ende(e)>=jetzt) || null;
  $("liste").innerHTML = items.map((e,i)=>{
    const vorbei = e.start && ende(e)<jetzt;
    const istNext = e===naechster;
    const kopf = `${istNext?'<div class="kopf">':''}
      <div class="emoji">${e.emoji}</div>
      <div class="info"><div class="titel">${e.titel}</div><div class="meta">${metaText(e)}</div></div>
      ${badge(e)}${istNext?'</div>':''}`;
    const cd = istNext ? `<div class="countdown" id="cd" aria-live="off">
        <div><b id="cdD">–</b><small>Tage</small></div><div><b id="cdH">–</b><small>Std</small></div>
        <div><b id="cdM">–</b><small>Min</small></div><div><b id="cdS">–</b><small>Sek</small></div></div>
        <div class="spruch" id="spruch"></div>` : "";
    return `<li class="${vorbei?'vorbei':''} ${istNext?'next':''}">
      <button class="zettel" data-i="${i}" type="button">
        ${istNext?'<span class="stempel">Nächsti Station</span>':''}${kopf}${cd}
      </button></li>`;
  }).join("");
  tick();
}

function tick(){
  if(!naechster) return;
  const jetzt=new Date(); let ms=naechster.start-jetzt;
  const laeuft = ms<=0;
  if(laeuft) ms=0;
  const s=Math.floor(ms/1000);
  $("cdD").textContent=Math.floor(s/86400);
  $("cdH").textContent=String(Math.floor(s%86400/3600)).padStart(2,"0");
  $("cdM").textContent=String(Math.floor(s%3600/60)).padStart(2,"0");
  $("cdS").textContent=String(s%60).padStart(2,"0");
  const tage=Math.floor(s/86400);
  $("spruch").textContent = laeuft ? "Isch im Gang – gnüss es!"
    : tage===0 ? "Hüt isch es soweit!"
    : tage<=7 ? "Rucksack scho packt?" : "Gnueg Ziit zum Freue.";
}

$("liste").addEventListener("click",ev=>{
  const b=ev.target.closest(".zettel"); if(!b) return;
  const e=items[+b.dataset.i];
  $("dEmoji").textContent=e.emoji;
  $("dTitel").textContent=e.titel;
  const zeilen=[["Wann",datumText(e)]];
  if(e.zeitText||e.zeit) zeilen.push(["Zeit",e.zeitText||e.zeit]);
  if(e.ort) zeilen.push(["Wo",e.ort]);
  $("dInfo").innerHTML=zeilen.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("dText").textContent=e.text||"";
  $("detail").showModal();
});
$("zu").onclick=()=>$("detail").close();
$("detail").addEventListener("click",ev=>{ if(ev.target.id==="detail") ev.target.close(); });

$("rover").innerHTML=ROVER.map(n=>`<span>${n}</span>`).join("");
render();
setInterval(tick,1000);
setInterval(render,60*60*1000);
</script>
</body>
</html>
